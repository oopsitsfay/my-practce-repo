name: Filter wallets

# Shown in the Actions list and read by the Vercel panel.
run-name: ${{ inputs.wallets_file }} — min ${{ inputs.min_tx }} tx, ${{ inputs.mode }}

# Run the wallet filter on GitHub's runners instead of a host you pay for.
# Trigger it from the Actions tab, come back when it is done, download the CSVs.
#
# Setup, once:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: ALCHEMY_URL   Value: https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY

on:
  workflow_dispatch:
    inputs:
      wallets_file:
        description: "Path to the wallet list in this repo"
        default: "wallet-filter/wallets.csv"
        required: true
      min_tx:
        description: "Keep wallets with at least this many transactions"
        default: "4"
        required: true
      mode:
        description: "What to count"
        type: choice
        options: [both, nonce, transfers]
        default: both
      categories:
        description: "Inbound transfer types (comma separated)"
        default: "external"
      cu_per_second:
        description: "Your Alchemy plan's compute units per second"
        default: "330"

concurrency:
  # The Alchemy budget is per key, so two runs would only throttle each other.
  group: wallet-filter
  cancel-in-progress: false

permissions:
  contents: write  # to publish each run's summary back to the repo

jobs:
  filter:
    runs-on: ubuntu-latest
    # A free-tier run of ~8k wallets takes about an hour; the ceiling is 6.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Check the wallet list exists
        run: |
          if [ ! -f "${{ inputs.wallets_file }}" ]; then
            echo "::error::No file at ${{ inputs.wallets_file }}. Commit your list, or point at another path."
            exit 1
          fi
          echo "$(grep -c . "${{ inputs.wallets_file }}") rows in ${{ inputs.wallets_file }}"

      - name: Restore previous progress
        # Every answer is checkpointed, so a re-run picks up where the last one
        # stopped -- whether it was cancelled, timed out, or ended with errors.
        uses: actions/cache@v4
        with:
          path: out
          key: wf-${{ hashFiles(inputs.wallets_file) }}-${{ inputs.min_tx }}-${{ inputs.mode }}-${{ inputs.categories }}-${{ github.run_id }}
          restore-keys: |
            wf-${{ hashFiles(inputs.wallets_file) }}-${{ inputs.min_tx }}-${{ inputs.mode }}-${{ inputs.categories }}-

      - name: Run the filter
        env:
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
        run: |
          if [ -z "$ALCHEMY_URL" ]; then
            echo "::error::ALCHEMY_URL secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python wallet-filter/filter_wallets.py "${{ inputs.wallets_file }}" \
            --min-tx "${{ inputs.min_tx }}" \
            --mode "${{ inputs.mode }}" \
            --categories "${{ inputs.categories }}" \
            --cu-per-second "${{ inputs.cu_per_second }}" \
            --out out

      - name: Write the summary
        if: always()
        run: python .github/scripts/summarize.py out/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the summary for the panel
        # Artifacts can only be fetched as a zip, which is a lot of work for six
        # numbers. Committing the summary lets any front end read the outcome
        # with a single API call, and leaves a browsable history in the repo.
        if: always()
        run: |
          [ -f out/summary.json ] || exit 0
          mkdir -p results
          python - "$GITHUB_RUN_ID" <<'PY' > "results/${GITHUB_RUN_ID}.json"
          import json, os, sys
          s = json.load(open("out/summary.json"))
          s["run_id"] = int(sys.argv[1])
          s["wallets_file"] = os.environ["WALLETS_FILE"]
          s["mode"] = os.environ["MODE"]
          print(json.dumps(s, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/${GITHUB_RUN_ID}.json"
          git commit -m "Results for run ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          WALLETS_FILE: ${{ inputs.wallets_file }}
          MODE: ${{ inputs.mode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-filter-results
          # The checkpoint is large and only useful to the cache, not to you.
          path: |
            out/*.csv
            out/summary.json
          if-no-files-found: warn
          retention-days: 30
